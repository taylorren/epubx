[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epubx"
version = "0.1.0"
description = "Open EPUB files and expose their content as a structured, lazily-parsed graph."
requires-python = ">=3.10"
dependencies = ["lxml", "Pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["epubx"]
