[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epubx"
dynamic = ["version"]
description = "Open EPUB files and expose their content as a structured, lazily-parsed graph."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taylor Ren", email = "taylor.ren@gmail.com" }]
keywords = ["epub", "ebook", "epub2", "epub3", "opf", "ncx", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = ["lxml"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/taylorren/epubx"
Repository = "https://github.com/taylorren/epubx"
Issues = "https://github.com/taylorren/epubx/issues"

[tool.setuptools]
packages = ["epubx"]

[tool.setuptools.dynamic]
# One source of truth: epubx/__init__.py holds __version__.
version = { attr = "epubx.__version__" }
